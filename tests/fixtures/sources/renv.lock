{
  "R": {
    "Version": "4.6.1",
    "Repositories": [
      {
        "Name": "CRAN",
        "URL": "https://cloud.r-project.org"
      }
    ]
  },
  "Packages": {
    "greeter": {
      "Package": "greeter",
      "Version": "0.2.0",
      "Source": "Local",
      "RemoteType": "local",
      "RemoteUrl": "../shared/greeter",
      "Cacheable": false
    },
    "praise": {
      "Package": "praise",
      "Version": "1.0.0",
      "Source": "URL",
      "RemoteType": "url",
      "RemoteUrl": "https://github.com/rladies/praise/archive/094469afaf033af00aeb46527970f1db22f4d49d.zip"
    },
    "renv": {
      "Package": "renv",
      "Version": "1.3.1",
      "Source": "Repository",
      "Imports": [
        "utils"
      ],
      "Suggests": [
        "BiocManager",
        "cli",
        "compiler",
        "covr",
        "cpp11",
        "curl",
        "devtools",
        "generics",
        "gitcreds",
        "jsonlite",
        "jsonvalidate",
        "knitr",
        "miniUI",
        "modules",
        "packrat",
        "pak",
        "pkgload",
        "R6",
        "remotes",
        "reticulate",
        "rmarkdown",
        "rstudioapi",
        "shiny",
        "testthat",
        "uuid",
        "waldo",
        "yaml",
        "webfakes"
      ],
      "License": "MIT + file LICENSE",
      "NeedsCompilation": "no",
      "Repository": "CRAN",
      "Type": "source"
    }
  }
}
