# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux and aarch64-linux: the flake's checks (the CLI
# build, the URL unit test, the sandboxed builds of the fixtures under
# tests/fixtures and a run of each, and the formatting), then tests/cli.sh
# for what runs outside the sandbox (the lock run, `build`, an offline
# `restore` and `publish`).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: tests/cli.sh
